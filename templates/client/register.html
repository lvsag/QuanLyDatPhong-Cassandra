<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tài khoản - Grand Luxe Hotels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d2137 100%);
            font-family: 'Inter', sans-serif;
        }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            max-width: 520px;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-header {
            background: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 100%);
            padding: 2rem 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .auth-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.1) 0%, transparent 50%);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }
        .auth-header h3 {
            color: #fff;
            font-weight: 700;
            margin-bottom: 0.3rem;
            position: relative;
        }
        .auth-header p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0;
            position: relative;
            font-size: 0.9rem;
        }
        .auth-header .brand-icon {
            font-size: 2.5rem;
            color: #ffc107;
            margin-bottom: 0.5rem;
            display: block;
            position: relative;
        }
        .auth-body {
            padding: 2rem 2.5rem 2.5rem;
        }
        .auth-body .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #333;
        }
        .auth-body .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e0e0e0;
            transition: all 0.3s;
        }
        .auth-body .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .btn-register {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 0.75rem;
            padding: 0.85rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
            color: white;
        }
        .divider-text {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #999;
            font-size: 0.85rem;
            margin: 1.5rem 0;
        }
        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: #e0e0e0;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-hotel brand-icon"></i>
                <h3><i class="fa-solid fa-user-plus me-2"></i>Tạo Tài Khoản Mới</h3>
                <p>Trải nghiệm đặt phòng nhanh chóng & tiện lợi</p>
            </div>
            <div class="auth-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show border-0 shadow-sm" role="alert">
                            <i class="fa-solid fa-{% if category == 'error' %}triangle-exclamation{% else %}circle-info{% endif %} me-1"></i>
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endwith %}

                <form method="POST" id="registerForm">
                    <div class="mb-3">
                        <label class="form-label"><i class="fa-solid fa-user text-primary me-1"></i> Họ và tên</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Nguyễn Văn An" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fa-solid fa-envelope text-primary me-1"></i> Email</label>
                        <input type="email" name="email" class="form-control" placeholder="nguyenvanan@gmail.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fa-solid fa-phone text-primary me-1"></i> Số điện thoại</label>
                        <input type="text" name="phone" class="form-control" placeholder="0901234567" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-lock text-primary me-1"></i> Mật khẩu</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Tối thiểu 4 ký tự" required minlength="4">
                            <div class="password-strength">
                                <div class="password-strength-bar" id="strengthBar"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label"><i class="fa-solid fa-lock text-primary me-1"></i> Xác nhận</label>
                            <input type="password" name="confirm_password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-register w-100 mb-3">
                        <i class="fa-solid fa-user-plus me-1"></i> Đăng Ký Tài Khoản
                    </button>
                </form>

                <div class="divider-text">Đã có tài khoản?</div>

                <a href="{{ url_for('client_login') }}" class="btn btn-outline-secondary w-100 rounded-3 py-2 fw-semibold">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng nhập ngay
                </a>

                <div class="text-center mt-3">
                    <a href="{{ url_for('client_index') }}" class="text-muted small text-decoration-none">
                        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang đặt phòng
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function () {
            const bar = document.getElementById('strengthBar');
            const len = this.value.length;
            if (len === 0) { bar.style.width = '0%'; bar.style.background = '#e0e0e0'; }
            else if (len < 4) { bar.style.width = '25%'; bar.style.background = '#ef4444'; }
            else if (len < 6) { bar.style.width = '50%'; bar.style.background = '#f59e0b'; }
            else if (len < 8) { bar.style.width = '75%'; bar.style.background = '#3b82f6'; }
            else { bar.style.width = '100%'; bar.style.background = '#22c55e'; }
        });

        // Confirm password validation
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            const pw = document.getElementById('password').value;
            const cpw = document.getElementById('confirmPassword').value;
            if (pw !== cpw) {
                e.preventDefault();
                alert('Mật khẩu xác nhận không khớp!');
            }
        });
    </script>
</body>
</html>
